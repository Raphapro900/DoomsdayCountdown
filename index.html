<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOMSDAY SE ACERCA — Avengers Countdown</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #020f08;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      color: #7dff9a;
      position: relative;
    }

    /* Fondo Doom animado */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(0, 80, 40, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(0, 60, 30, 0.35) 0%, transparent 45%),
        linear-gradient(160deg, #021a0c 0%, #041f10 40%, #010d07 100%);
      z-index: 0;
    }

    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 255, 100, 0.03) 2px,
          rgba(0, 255, 100, 0.03) 4px
        );
      animation: scan 8s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    /* Partículas verdes */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #00ff6a;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff6a, 0 0 16px #00cc55;
      animation: float linear infinite;
      opacity: 0.6;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Contenedor principal */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }

    .title {
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #a8ffc0;
      text-shadow:
        0 0 10px #00ff6a,
        0 0 25px #00cc55,
        0 0 50px rgba(0, 255, 100, 0.4);
      margin-bottom: 0.5rem;
      animation: pulse-glow 2.5s ease-in-out infinite;
    }

    .subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: #4dff88;
      letter-spacing: 0.15em;
      margin-bottom: 2.5rem;
      opacity: 0.85;
    }

    @keyframes pulse-glow {
      0%, 100% { text-shadow: 0 0 10px #00ff6a, 0 0 25px #00cc55, 0 0 50px rgba(0,255,100,0.4); }
      50% { text-shadow: 0 0 18px #00ff6a, 0 0 40px #00cc55, 0 0 80px rgba(0,255,100,0.6); }
    }

    /* Contador */
    .countdown {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 1.5rem;
      margin-bottom: 2rem;
    }

    .unit {
      min-width: 110px;
      background: linear-gradient(145deg, rgba(0, 40, 20, 0.85), rgba(0, 25, 12, 0.95));
      border: 1px solid rgba(0, 255, 100, 0.25);
      border-radius: 12px;
      padding: 1.2rem 1rem 0.9rem;
      box-shadow:
        0 0 20px rgba(0, 255, 100, 0.15),
        inset 0 0 30px rgba(0, 80, 40, 0.3);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .unit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 100, 0.08), transparent);
      animation: shine 4s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 100% { left: -100%; }
      50% { left: 100%; }
    }

    .unit:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 30px rgba(0, 255, 100, 0.35), inset 0 0 30px rgba(0, 80, 40, 0.4);
    }

    .number {
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 700;
      line-height: 1;
      color: #b8ffd0;
      text-shadow:
        0 0 12px #00ff6a,
        0 0 30px rgba(0, 255, 100, 0.5);
      font-variant-numeric: tabular-nums;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .number.tick {
      transform: scale(1.12);
      color: #e0ffe8;
      text-shadow: 0 0 20px #00ff6a, 0 0 40px #00ff6a;
    }

    .label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: #3dcc6e;
      margin-top: 0.55rem;
      text-transform: uppercase;
    }

    .separator {
      font-size: 2.5rem;
      color: #00ff6a;
      align-self: center;
      text-shadow: 0 0 15px #00ff6a;
      animation: blink 1s step-end infinite;
      display: none;
    }

    @media (min-width: 700px) {
      .separator { display: block; }
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    /* Mensaje final */
    .final-msg {
      display: none;
      font-size: clamp(1.5rem, 5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #ff4444;
      text-shadow: 0 0 20px #ff0000, 0 0 40px rgba(255,0,0,0.6);
      animation: pulse-red 1s ease-in-out infinite;
    }

    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 1.2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: #2a8a4a;
      letter-spacing: 0.1em;
      z-index: 10;
      opacity: 0.7;
      line-height: 1.6;
    }

    .footer .credit {
      color: #3dcc6e;
      font-size: 0.72rem;
      margin-bottom: 0.15rem;
    }

    /* Botón de sonido */
    .sound-btn {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      z-index: 20;
      background: rgba(0, 40, 20, 0.8);
      border: 1px solid rgba(0, 255, 100, 0.4);
      color: #7dff9a;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.2s;
    }

    .sound-btn:hover {
      background: rgba(0, 60, 30, 0.9);
      box-shadow: 0 0 15px rgba(0, 255, 100, 0.3);
    }

    .sound-btn.off {
      color: #666;
      border-color: #444;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <button class="sound-btn" id="soundBtn">SONIDO ON</button>

  <div class="container">
    <h1 class="title">DOOMSDAY SE ACERCA</h1>
    <p class="subtitle">Avengers: Doomsday — 18 de diciembre de 2026</p>

    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="number" id="months">00</div>
        <div class="label">Meses</div>
      </div>
      <div class="separator">:</div>
      <div class="unit">
        <div class="number" id="days">00</div>
        <div class="label">Días</div>
      </div>
      <div class="separator">:</div>
      <div class="unit">
        <div class="number" id="hours">00</div>
        <div class="label">Horas</div>
      </div>
      <div class="separator">:</div>
      <div class="unit">
        <div class="number" id="minutes">00</div>
        <div class="label">Min</div>
      </div>
      <div class="separator">:</div>
      <div class="unit">
        <div class="number" id="seconds">00</div>
        <div class="label">Seg</div>
      </div>
    </div>

    <div class="final-msg" id="finalMsg">¡DOOMSDAY HA LLEGADO!</div>
  </div>

  <div class="footer">
    <div class="credit">CC0 Raphapro900 - V1.0</div>
    <div>Fan-made countdown · No afiliado a Marvel Studios</div>
  </div>

  <!-- Audios -->
  <audio id="clock1" preload="auto" src="Clock_1.mp3"></audio>
  <audio id="clock2" preload="auto" src="Clock_2.mp3"></audio>

  <script>
    // Fecha objetivo: 18 de diciembre de 2026, 05:00 UTC
    const targetDate = new Date(Date.UTC(2026, 11, 18, 5, 0, 0));

    const monthsEl = document.getElementById('months');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const finalMsg = document.getElementById('finalMsg');
    const countdown = document.getElementById('countdown');
    const clock1 = document.getElementById('clock1');
    const clock2 = document.getElementById('clock2');
    const soundBtn = document.getElementById('soundBtn');

    let soundEnabled = true;
    let lastSecond = -1;

    // Control de sonido
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? 'SONIDO ON' : 'SONIDO OFF';
      soundBtn.classList.toggle('off', !soundEnabled);
    });

    // Crear partículas
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 35; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (6 + Math.random() * 10) + 's';
        p.style.animationDelay = (Math.random() * 8) + 's';
        p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
        container.appendChild(p);
      }
    }
    createParticles();

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function tickAnimation(el) {
      el.classList.remove('tick');
      void el.offsetWidth; // force reflow
      el.classList.add('tick');
      setTimeout(() => el.classList.remove('tick'), 180);
    }

    function playTick(second) {
      if (!soundEnabled) return;
      // Número impar → Clock_1, par → Clock_2
      const audio = (second % 2 === 1) ? clock1 : clock2;
      audio.currentTime = 0;
      audio.play().catch(() => {}); // evita error si el navegador bloquea autoplay
    }

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        countdown.style.display = 'none';
        finalMsg.style.display = 'block';
        return;
      }

      // Cálculo de meses / días / horas / min / seg
      const totalSeconds = Math.floor(diff / 1000);
      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes = totalMinutes % 60;
      const totalHours = Math.floor(totalMinutes / 60);
      const hours = totalHours % 24;
      const totalDays = Math.floor(totalHours / 24);

      // Aproximación de meses (30.44 días promedio)
      const months = Math.floor(totalDays / 30.44);
      const days = Math.floor(totalDays % 30.44);

      // Actualizar valores
      if (monthsEl.textContent !== pad(months)) {
        monthsEl.textContent = pad(months);
        tickAnimation(monthsEl);
      }
      if (daysEl.textContent !== pad(days)) {
        daysEl.textContent = pad(days);
        tickAnimation(daysEl);
      }
      if (hoursEl.textContent !== pad(hours)) {
        hoursEl.textContent = pad(hours);
        tickAnimation(hoursEl);
      }
      if (minutesEl.textContent !== pad(minutes)) {
        minutesEl.textContent = pad(minutes);
        tickAnimation(minutesEl);
      }

      // Segundos + sonido
      if (seconds !== lastSecond) {
        secondsEl.textContent = pad(seconds);
        tickAnimation(secondsEl);
        playTick(seconds);
        lastSecond = seconds;
      }
    }

    // Primera actualización inmediata
    updateCountdown();
    setInterval(updateCountdown, 250);
  </script>
</body>
</html>
